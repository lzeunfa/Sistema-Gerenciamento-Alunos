; Endurecimento do PHP no container (equivale ao que foi feito no php.ini do XAMPP)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; erros vao para o log do container: docker compose logs app
error_log = /dev/stderr

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

allow_url_include = Off
