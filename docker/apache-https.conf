# HTTPS do container (DOC/DECISOES.md D-011). Certificado em /etc/gkt-certificados (volume "certificados"):
# gerado sozinho na primeira subida (autoassinado) ou substituido por um certificado real (docker/README.md).

# porta 80: tudo vai para HTTPS
<VirtualHost *:80>
    ServerName localhost
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/gkt-certificados/gkt.crt
    SSLCertificateKeyFile /etc/gkt-certificados/gkt.key

    # so TLS 1.2 e 1.3, cifras modernas (perfil "intermediate" da Mozilla)
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder     off
    SSLSessionTickets       off
    SSLCompression          off

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
