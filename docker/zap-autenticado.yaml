# Plano do OWASP ZAP (Automation Framework) para varrer o sistema LOGADO como administrador.
# Rodado por docker/varredura-autenticada.sh, que faz o login e passa o cookie de sessao em ZAP_COOKIE.
# So ataca a copia do sistema ligada ao banco de teste (docker/copia-teste.sh), nunca o container "app".
env:
  contexts:
    - name: gkt
      urls:
        - https://gkt-app-teste/sistema.php
      includePaths:
        - "https://gkt-app-teste/.*"
      excludePaths:
        # nao encerrar a sessao nem gerar bloqueio de login durante a varredura
        - "https://gkt-app-teste/logout\\.php.*"
        - "https://gkt-app-teste/BACKEND/CONTROLLER/actions\\.php.*"
        - "https://gkt-app-teste/index\\.php.*"
  parameters:
    failOnError: true
    progressToStdout: true

jobs:
  # toda requisicao do ZAP leva o cookie da sessao do administrador temporario
  - type: replacer
    rules:
      - description: sessao do administrador temporario
        url: "https://gkt-app-teste/.*"
        matchType: req_header
        matchString: Cookie
        matchRegex: false
        replacementString: ${ZAP_COOKIE}
  - type: requestor
    requests:
      - url: https://gkt-app-teste/sistema.php?pagina=DASHBOARD
      - url: https://gkt-app-teste/sistema.php?pagina=ALUNOS
      - url: https://gkt-app-teste/sistema.php?pagina=TURMAS
      - url: https://gkt-app-teste/sistema.php?pagina=CADASTRAR
  - type: spider
    parameters:
      context: gkt
      url: https://gkt-app-teste/sistema.php
      maxDuration: 5
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: activeScan
    parameters:
      context: gkt
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 45
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: zap-autenticado
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-autenticado
