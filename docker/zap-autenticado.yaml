# Plano do OWASP ZAP (Automation Framework) para varrer o sistema LOGADO como administrador.
# Rodado por docker/varredura-autenticada.sh, que faz o login, passa o cookie de sessao em ZAP_COOKIE
# e no fim apaga o administrador temporario. So ataca o container "app" desta rede do Docker.
env:
  contexts:
    - name: gkt
      urls:
        - http://app/sistema.php
      includePaths:
        - "http://app/.*"
      excludePaths:
        # nao encerrar a sessao nem gerar bloqueio de login durante a varredura
        - "http://app/logout\\.php.*"
        - "http://app/BACKEND/CONTROLLER/actions\\.php.*"
        - "http://app/index\\.php.*"
  parameters:
    failOnError: true
    progressToStdout: true

jobs:
  # toda requisicao do ZAP leva o cookie da sessao do administrador temporario
  - type: replacer
    rules:
      - description: sessao do administrador temporario
        url: "http://app/.*"
        matchType: req_header
        matchString: Cookie
        matchRegex: false
        replacementString: ${ZAP_COOKIE}
  - type: requestor
    requests:
      - url: http://app/sistema.php?pagina=DASHBOARD
      - url: http://app/sistema.php?pagina=ALUNOS
      - url: http://app/sistema.php?pagina=TURMAS
      - url: http://app/sistema.php?pagina=CADASTRAR
  - type: spider
    parameters:
      context: gkt
      url: http://app/sistema.php
      maxDuration: 5
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: activeScan
    parameters:
      context: gkt
      maxRuleDurationInMins: 5
      maxScanDurationInMins: 45
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: zap-autenticado
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-autenticado
