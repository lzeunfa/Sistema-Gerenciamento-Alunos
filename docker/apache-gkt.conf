# Apache do container: mesmas protecoes do XAMPP endurecido (ver DOC/SEGURANCA_LGPD.md)
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# o .htaccess do projeto precisa valer (bloqueio de .env, DB/, vendor/, cabecalhos...)
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
