# 2a instancia do Apache do XAMPP so para teste de carga (tests/carga/carga_windows.ps1): porta 8098, so 127.0.0.1,
# banco gktgym_teste. Mesmo PHP, mesmo .htaccess e o mesmo numero de threads do XAMPP (ThreadsPerChild 150).
Define SRVROOT "C:/xampp/apache"
ServerRoot "C:/xampp/apache"
Listen 127.0.0.1:8098
ServerName 127.0.0.1:8098
PidFile "logs/gkt-carga.pid"
ErrorLog "logs/gkt-carga-error.log"
LogLevel warn

LoadModule access_compat_module modules/mod_access_compat.so
LoadModule alias_module modules/mod_alias.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so

LoadFile "C:/xampp/php/php8ts.dll"
LoadFile "C:/xampp/php/libpq.dll"
LoadFile "C:/xampp/php/libsqlite3.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPINIDir "C:/xampp/php"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

TypesConfig conf/mime.types
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ThreadsPerChild 150
MaxConnectionsPerChild 0
KeepAlive On

DocumentRoot "C:/xampp/htdocs"
<Directory />
    AllowOverride none
    Require all denied
</Directory>
<Directory "C:/xampp/htdocs">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
DirectoryIndex index.php index.html

# o sistema usa o banco de teste nesta instancia (config.php le GKT_DB_DATABASE)
SetEnv GKT_DB_DATABASE gktgym_teste
